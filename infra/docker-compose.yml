name: semakan

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: semakan
      POSTGRES_PASSWORD: semakan
      POSTGRES_DB: semakan
    ports:
      - '55432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U semakan -d semakan']
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://semakan:semakan@postgres:5432/semakan
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
